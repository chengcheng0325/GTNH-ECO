
pluginManagement {
    repositories {
        // Project-local repo: redirects the unpublished RFG 1.4.1 plugin marker to 1.4.2
        maven {
            name "Project Local Maven"
            url uri("${rootDir}/local-maven")
        }
        maven {
            // RetroFuturaGradle
            name "GTNH Maven"
            url "https://nexus.gtnewhorizons.com/repository/public/"
            mavenContent {
                includeGroup("com.gtnewhorizons")
                includeGroupByRegex("com\\.gtnewhorizons\\..+")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
    }
}

plugins {
    id 'com.gtnewhorizons.gtnhsettingsconvention' version '1.0.27'
}
